name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ext-repository: ${{ steps.ext-lock.outputs.repository }}
      ext-commit: ${{ steps.ext-lock.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - run: tools/check-all.sh
      - id: ext-lock
        name: Read tools/ext.lock
        run: |
          grep -E '^(repository|commit)=' tools/ext.lock >> "$GITHUB_OUTPUT"

  sign-off:
    name: maintainer sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - name: Keep only the labels set after the newest push
        id: labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "fresh=$(python3 tools/fresh_labels.py "$REPOSITORY" "$NUMBER" "$HEAD")" >> "$GITHUB_OUTPUT"
      - name: Require the labels hosts-approved and io-acknowledged where needed
        env:
          FRESH_LABELS: ${{ steps.labels.outputs.fresh }}
        run: python3 tools/check_package.py --sign-off --base "$BASE" --changed --labels "$FRESH_LABELS"

  ext-test:
    name: ext test
    needs: checks
    # Skipped, and shown as skipped, until tools/ext.lock pins a commit of the app repository that has ext.
    if: needs.checks.outputs.ext-commit != ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.checks.outputs.ext-repository }}
          ref: ${{ needs.checks.outputs.ext-commit }}
          path: .cache/moneten
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: tools/setup.sh
      - name: Build ext from the pinned commit
        run: swift build --disable-keychain -c release --product ext --package-path .cache/moneten
      - run: tools/check-all.sh
        env:
          EXT: .cache/moneten/.build/release/ext
