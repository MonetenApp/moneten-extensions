name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ext-repository: ${{ steps.ext-lock.outputs.repository }}
      ext-commit: ${{ steps.ext-lock.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - run: tools/check-all.sh
      - id: ext-lock
        name: Read tools/ext.lock
        run: |
          grep -E '^(repository|commit)=' tools/ext.lock >> "$GITHUB_OUTPUT"

  sign-off:
    name: maintainer sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - name: Require the labels hosts-approved and io-acknowledged where needed
        run: python3 tools/check_package.py --sign-off --base "$BASE" --changed --labels "$LABELS"

  ext-test:
    name: ext test
    needs: checks
    runs-on: ${{ needs.checks.outputs.ext-commit != '' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      EXT_COMMIT: ${{ needs.checks.outputs.ext-commit }}
    steps:
      - name: Skip while tools/ext.lock pins no commit
        if: env.EXT_COMMIT == ''
        run: echo "::notice title=ext test skipped::tools/ext.lock pins no commit of ${{ needs.checks.outputs.ext-repository }}, because the ext tool does not exist there yet. No recording was replayed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXT_COMMIT != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXT_COMMIT != ''
        with:
          repository: ${{ needs.checks.outputs.ext-repository }}
          ref: ${{ env.EXT_COMMIT }}
          path: .cache/moneten
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.EXT_COMMIT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - if: env.EXT_COMMIT != ''
        run: tools/setup.sh
      - name: Build ext from the pinned commit
        if: env.EXT_COMMIT != ''
        run: swift build --disable-keychain -c release --product ext --package-path .cache/moneten
      - if: env.EXT_COMMIT != ''
        run: tools/check-all.sh
        env:
          EXT: .cache/moneten/.build/release/ext
