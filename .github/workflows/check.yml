name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ext-commit: ${{ steps.ext-lock.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/lua-*.tar.gz
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - run: tools/check-all.sh
      - id: ext-lock
        name: Read the commit of MonetenApp/Moneten in tools/ext.lock
        run: |
          commit="$(sed -n 's/^commit=//p' tools/ext.lock)"
          if [[ -n "$commit" && ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=tools/ext.lock::commit must be empty or a full commit of MonetenApp/Moneten."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  ext-test:
    name: ext test
    needs: checks
    # Skipped, and shown as skipped, until tools/ext.lock pins a commit of the app repository that has ext.
    if: needs.checks.outputs.ext-commit != ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MonetenApp/Moneten
          ref: ${{ needs.checks.outputs.ext-commit }}
          path: .cache/moneten
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main of MonetenApp/Moneten
        env:
          COMMIT: ${{ needs.checks.outputs.ext-commit }}
        run: git -C .cache/moneten merge-base --is-ancestor "$COMMIT" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: tools/setup.sh
      - name: Build ext from the pinned commit
        run: swift build --disable-keychain -c release --product ext --package-path .cache/moneten
      - name: Require the ext binary
        run: .cache/moneten/.build/release/ext --version
      # Only the replays run here. The job checks runs the tests of the tools, whose signing tests need OpenSSL 3.
      - name: Replay every recording with ext
        run: python3 tools/check_package.py --ext .cache/moneten/.build/release/ext extensions/*/ docs/guide/tutorial
