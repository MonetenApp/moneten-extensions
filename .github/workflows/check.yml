name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ext-version: ${{ steps.ext-lock.outputs.version }}
      ext-commit: ${{ steps.ext-lock.outputs.commit }}
      ext-url: ${{ steps.ext-lock.outputs.url }}
      ext-sha256: ${{ steps.ext-lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/lua-*.tar.gz
          key: lua-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - run: tools/setup.sh
      - run: tools/check-all.sh
      - id: ext-lock
        name: Read the release of ext in tools/ext.lock
        run: python3 tools/ext_lock.py >> "$GITHUB_OUTPUT"

  ext-test:
    name: ext test
    needs: checks
    # Skipped, and shown as skipped, while tools/ext.lock pins no release of ext.
    if: needs.checks.outputs.ext-version != ''
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.checks.outputs.ext-version }}
      COMMIT: ${{ needs.checks.outputs.ext-commit }}
      URL: ${{ needs.checks.outputs.ext-url }}
      SHA256: ${{ needs.checks.outputs.ext-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release workflow of MonetenApp/Moneten checks the same. This check costs one fetch of the commits without
      # their files, and keeps a lock that names a commit of another branch from passing.
      - name: Require the tag of the release on main of MonetenApp/Moneten
        run: |
          git init -q .cache/moneten
          git -C .cache/moneten fetch -q --no-tags --filter=tree:0 https://github.com/MonetenApp/Moneten.git \
            "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/ext-v$VERSION:refs/tags/ext-v$VERSION"
          tagged="$(git -C .cache/moneten rev-parse "refs/tags/ext-v$VERSION^{commit}")"
          if [[ "$tagged" != "$COMMIT" ]]; then
            echo "::error file=tools/ext.lock::The tag ext-v$VERSION names $tagged, not the commit $COMMIT."
            exit 1
          fi
          git -C .cache/moneten merge-base --is-ancestor "$COMMIT" origin/main
      # tools/fetch_ext.sh checks the SHA-256, the one entry of the zip, the signature, and ext --version before the
      # recordings run.
      - name: Fetch and check the pinned release of ext
        run: tools/fetch_ext.sh .cache
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: tools/setup.sh
      # Only the replays run here. The job checks runs the tests of the tools, whose signing tests need OpenSSL 3.
      - name: Replay every recording with ext
        run: python3 tools/check_package.py --ext .cache/ext/ext extensions/*/ docs/guide/tutorial
